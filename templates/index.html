<!DOCTYPE html>
<html>

<head>
    <title>DPR Multi-Agent Console</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <button class="models-toggle" onclick="toggleModelsDrawer()">Models</button>
    <button class="memory-toggle" onclick="toggleMemoryDrawer()">Memory</button>

    <aside id="models-drawer" class="models-drawer">
        <div class="memory-header">
            <h2>Agent Models</h2>
            <div class="drawer-actions">
                <button class="btn btn-muted" onclick="applyModelSelection()">Select Models</button>
                <button class="btn btn-muted" onclick="closeModelsDrawer()">Close</button>
            </div>
        </div>
        <div class="memory-content">
            <p id="model-count" class="models-meta">Select at least 2 models.</p>
            <div class="models-actions">
                <label class="select-all-row">
                    <input id="select-all-models" type="checkbox" onchange="toggleSelectAll(this.checked)">
                    <span>Select All Models</span>
                </label>
            </div>
            <div id="models-list" class="models-list"></div>
        </div>
    </aside>

    <aside id="memory-drawer" class="memory-drawer">
        <div class="memory-header">
            <h2>Shared Memory</h2>
            <button class="btn btn-muted" onclick="toggleMemoryDrawer()">Close</button>
        </div>
        <div class="memory-content">
            <div id="memory-view"></div>
            <h3>Context Preview</h3>
            <pre id="context-view" class="context-view">(no context yet)</pre>
        </div>
    </aside>

    <div class="app">
        <header class="header">
            <div>
                <h1>DPR Console</h1>
                <p>Distributed Protocol for Reasoning</p>
            </div>
            <span class="header-badge">Live Session</span>
        </header>

        <div id="chat" class="chat"></div>

        <div id="suggestion-box" class="suggestion-box hidden">
            <div class="suggestion-title">Suggested Agent Selection</div>
            <div id="suggestion-text" class="suggestion-text"></div>
            <div class="suggestion-actions">
                <button class="btn btn-muted" onclick="approveSuggestedModels()">Approve Suggested</button>
                <button class="btn btn-muted" onclick="useManualSelection()">Edit Manually</button>
            </div>
        </div>

        <div class="control-panel">
            <button class="btn btn-muted" onclick="pause()">Pause</button>
            <button class="btn btn-muted" onclick="resume()">Resume</button>
            <button class="btn btn-muted" onclick="stopReasoning()">Stop Reasoning</button>
            <button class="btn btn-muted" onclick="raiseHand()">Raise Hand</button>
        </div>

        <div id="human-turn-options" class="control-panel hidden">
            <span class="command-label">HUMAN TURN ACTION</span>
            <button class="btn btn-muted" onclick="showHumanTurnInject()">Use Inject</button>
            <button class="btn btn-muted" onclick="showHumanTurnRedirect()">Use Redirect</button>
        </div>

        <div id="finalization-options" class="control-panel hidden">
            <span class="command-label">COMPLETION CONTROL</span>
            <button class="btn btn-muted" onclick="approveStop()">Approve Stop</button>
            <button class="btn btn-muted" onclick="continueIteration()">Continue Iteration</button>
            <button class="btn btn-muted" onclick="showFinalizeRedirect()">Redirect & Continue</button>
        </div>

        <div id="command-box" class="command-box hidden">
            <span id="command-label" class="command-label"></span>
            <input id="command-input" placeholder="Enter command message...">
            <input id="redirect-turns" type="number" min="1" value="3" class="hidden" title="Redirect turns">
            <button id="command-send-btn" class="btn" onclick="submitCommand()" disabled>Send</button>
        </div>

        <div class="input-bar">
            <textarea id="question" placeholder="Ask something..."></textarea>
            <button id="start-btn" class="btn" onclick="start()" disabled>Start</button>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>

</html>
